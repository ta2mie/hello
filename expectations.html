<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>期望設定 | GSA Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>銀齡守護者計劃 — 期望設定</h1>
    <nav>
      <ul>
        <li><a href="timeline.html">時間表</a></li>
        <li><a href="training.html">培訓名單</a></li>
        <li><a href="goal.html">目標評估</a></li>
        <li><a href="co-create.html">共創準備</a></li>
        <li><a href="outcome.html">共創成果</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h2>單位基本資料</h2>
      <form id="unit-info">
        <label>單位名稱：</label><input type="text" name="unitName" required>
        <label>地址：</label><input type="text" name="address">
        <label>網站：</label><input type="url" name="website">
        <label>社交媒體：</label><input type="text" name="socialMedia">
      </form>
    </section>

    <section class="roles">
      <h2>角色與職責</h2>
      <table>
        <thead>
          <tr><th>角色</th><th>職責</th></tr>
        </thead>
        <tbody>
          <tr><td>管理層 (院長級)</td><td>傳遞願景與期望，安排資源，支持計劃執行</td></tr>
          <tr><td>管理層 (副院長級)</td><td>與 GSA 團隊合作，落實價值為本工作流程</td></tr>
          <tr><td>前線主管</td><td>建立並實踐文化</td></tr>
          <tr><td>前線同事</td><td>落實並展現文化</td></tr>
        </tbody>
      </table>
    </section>

    <section class="agreement">
      <h2>聲明與期望</h2>
      <textarea name="expectations" rows="6" placeholder="輸入單位期望、挑戰及承諾..."></textarea>
      <button type="submit">儲存期望</button>
    </section>
  </main>

  <footer>
    <p>© 2026 銀齡守護者計劃 | GSA Portal</p>
  </footer>
</body>
</html>
